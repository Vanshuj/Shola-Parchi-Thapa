spring:
  application:
    name: solah-parchi-thap
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/solah_parchi_thap}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-min-32-characters-long}
    expiration-ms: 86400000
  cors:
    origin: ${CORS_ORIGIN:http://localhost:8000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
